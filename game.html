<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GTA Mini: Realistic Edition (Split Files)</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #111; 
      font-family: 'Segoe UI', sans-serif; 
      color: white; 
    }
    #ui {
      position: absolute; 
      top: 20px; 
      left: 20px;
      background: rgba(0, 0, 0, 0.6); 
      padding: 15px; 
      border-radius: 8px;
      pointer-events: none; 
      text-shadow: 1px 1px 2px black;
      max-width: 350px; 
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 10;
    }
    canvas { display: block; }
    h3 { margin-top: 0; color: #4ade80; }
    .stat { font-size: 1.1em; margin: 5px 0; }
  </style>
</head>
<body>

  <!-- Интерфейс -->
  <div id="ui">
    <h3>GTA Mini: Realistic (EN)</h3>
    <p class="stat">WASD — Move / Drive</p>
    <p class="stat">Space — Jump (on foot)</p>
    <p class="stat">E — Enter / Exit Vehicle</p>
    <p class="stat">Mouse Drag — Look Around (on foot)</p>
    <p id="status" style="font-size: 1.2em; margin-top: 15px; color: #f87171;">Status: On Foot</p>
    <p id="speed" style="font-size: 1.2em; color: #fbbf24;">Speed: 0 km/h</p>
  </div>

  <!-- Подключаем Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  
  <!-- Подключаем наш скрипт -->
  <script src="script.js"></script>
</body>
</html>
